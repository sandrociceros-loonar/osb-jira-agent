# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: osb-jira-agent
requiredVersions:
  azd: ">=1.27.1"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.9"

services:
  osb-jira-agent:
    project: .
    host: azure.ai.agent
    language: python
    kind: hosted
    name: osb-jira-agent
    description: Hosted Jira commercial workflow agent using the Foundry Invocations protocol.
    codeConfiguration:
      runtime: python_3_13
      entryPoint: src/hosted_agent/main.py
      dependencyResolution: remote_build
    protocols:
      - protocol: invocations
        version: 2.0.0
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
