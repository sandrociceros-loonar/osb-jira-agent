# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: osb-jira-agent
requiredVersions:
  azd: ">=1.27.1"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.9"

services:
  osb-jira-agent:
    project: .
    host: azure.ai.agent
    language: python
    kind: hosted
    name: osb-jira-agent
    description: Hosted Jira commercial workflow agent using the Foundry Invocations protocol.
    codeConfiguration:
      runtime: python_3_13
      entryPoint: src/hosted_agent/main.py
      dependencyResolution: remote_build
    protocols:
      - protocol: invocations
        version: 2.0.0
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      - name: ENVIRONMENT
        value: ${ENVIRONMENT}
      - name: JIRA_KEY_VAULT_URL
        value: ${JIRA_KEY_VAULT_URL}
      - name: AZURE_AI_MAX_TOOL_CALLS
        value: ${AZURE_AI_MAX_TOOL_CALLS}
      - name: JIRA_WEBHOOK_SECRET_HEADER
        value: ${JIRA_WEBHOOK_SECRET_HEADER}
      - name: JIRA_INSTANCE_URL
        value: ${JIRA_INSTANCE_URL}
      - name: JIRA_API_EMAIL
        value: ${JIRA_API_EMAIL}
      - name: JIRA_TEAM_ACCOUNT_IDS
        value: ${JIRA_TEAM_ACCOUNT_IDS}
      - name: JIRA_PROJECT_KEY
        value: ${JIRA_PROJECT_KEY}
      - name: JIRA_ALLOWED_PROJECT_KEYS
        value: ${JIRA_ALLOWED_PROJECT_KEYS}
      - name: JIRA_LEAD_PROJECT_KEY
        value: ${JIRA_LEAD_PROJECT_KEY}
      - name: JIRA_LEAD_ISSUE_TYPE_ID
        value: ${JIRA_LEAD_ISSUE_TYPE_ID}
      - name: JIRA_TRANSITION_IDS
        value: ${JIRA_TRANSITION_IDS}
      - name: JIRA_ENABLE_WRITE_OPERATIONS
        value: ${JIRA_ENABLE_WRITE_OPERATIONS}
      - name: JIRA_ASSETS_CLOUD_ID
        value: ${JIRA_ASSETS_CLOUD_ID}
      - name: JIRA_ASSETS_WORKSPACE_ID
        value: ${JIRA_ASSETS_WORKSPACE_ID}
      - name: JIRA_ASSETS_PRODUCT_OBJECT_TYPE_ID
        value: ${JIRA_ASSETS_PRODUCT_OBJECT_TYPE_ID}
      - name: JIRA_MANUFACTURER_FIELD_ID
        value: ${JIRA_MANUFACTURER_FIELD_ID}
      - name: JIRA_AGENT_ACCOUNT_ID
        value: ${JIRA_AGENT_ACCOUNT_ID}
      - name: JIRA_ATTACHMENT_MAX_BYTES
        value: ${JIRA_ATTACHMENT_MAX_BYTES}
      - name: LOG_LEVEL
        value: ${LOG_LEVEL}
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
