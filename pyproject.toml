[project]
name = "osb-jira-agent"
version = "0.1.0"
description = "AI Agent on Microsoft Azure AI Foundry integrated with Jira Service Management for operational triage and automation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "azure-ai-projects>=1.0.0b1",
    "azure-identity>=1.19.0",
    "azure-functions>=1.21.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --import-mode=importlib"
