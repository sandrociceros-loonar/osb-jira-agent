      <stop offset="0" stop-color="#F5F8FD"/>
      <stop offset="1" stop-color="#EAF1FB"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123B78"/>
      <stop offset="1" stop-color="#102A43"/>
    </linearGradient>
