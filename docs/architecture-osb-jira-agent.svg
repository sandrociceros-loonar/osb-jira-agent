      .body { font-size: 16px; fill: #425B76; }
      .small { font-size: 14px; fill: #60758D; }
      .card { fill: #FFFFFF; stroke: #D8E3F0; stroke-width: 1.5; }
      .connector { fill: none; stroke: #2473C8; stroke-width: 3; marker-end: url(#arrow); }
      .sync { fill: none; stroke: #11998E; stroke-width: 3; stroke-dasharray: 9 8; marker-end: url(#arrowTeal); }
    </style>
  </defs>

