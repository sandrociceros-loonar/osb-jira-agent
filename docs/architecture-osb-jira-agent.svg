<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1120" viewBox="0 0 1680 1120" role="img" aria-labelledby="title description">
  <title id="title">Arquitetura do agente comercial OSB Software para Jira</title>
  <desc id="description">Diagrama dos canais Jira, Azure Function e Foundry Hosted Agent, processamento central do agente OSB, integrações com Microsoft Foundry, Jira Assets e Confluence, segurança e infraestrutura.</desc>
